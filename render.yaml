services:
  - type: web
    name: artisan-marketplace-web
    runtime: docker
    plan: <YOUR_WEB_PLAN>
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./start.sh
    healthCheckPath: /healthz/
    preDeployCommand: python manage.py migrate --noinput && python manage.py bootstrap_v2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: artisan-marketplace-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: artisan-marketplace-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: PAYSTACK_ENVIRONMENT
        value: "test"

      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      - key: TERMII_API_KEY
        sync: false

      - key: TERMII_SENDER_ID
        sync: false

      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_PORT
        value: "465"

      - key: EMAIL_USE_SSL
        value: "True"

      - key: EMAIL_USE_TLS
        value: "False"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "no-reply@artisanmarketplace.ng"

      - key: STORAGE_ENDPOINT_URL
        sync: false

      - key: STORAGE_BUCKET
        value: "artisan-verification-private"

      - key: STORAGE_ACCESS_KEY
        sync: false

      - key: STORAGE_SECRET_KEY
        sync: false

      - key: STORAGE_REGION
        value: "auto"

      - key: SENTRY_DSN
        sync: false

      - key: SENTRY_ENVIRONMENT
        value: "production"

      - key: WEBCHAT_OTP_TTL_SECONDS
        value: "300"

      - key: WEBCHAT_OTP_RESEND_COOLDOWN_SECONDS
        value: "45"

      - key: WEBCHAT_ACTIVE_WINDOW_HOURS
        value: "24"

      - key: WEBCHAT_POLL_INTERVAL_MS
        value: "2500"

      - key: ENABLE_DEV_CONSOLE
        value: "False"

      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"

  - type: worker
    name: artisan-marketplace-worker
    runtime: docker
    plan: <YOUR_WORKER_PLAN>
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A config worker -l info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: artisan-marketplace-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: artisan-marketplace-redis
          property: connectionString

      - key: SECRET_KEY
        fromService:
          name: artisan-marketplace-web
          type: web
          envVarKey: SECRET_KEY

      - key: DEBUG
        value: "False"

      - key: PAYSTACK_ENVIRONMENT
        value: "test"

      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: TERMII_API_KEY
        sync: false

      - key: TERMII_SENDER_ID
        sync: false

      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_PORT
        value: "465"

      - key: EMAIL_USE_SSL
        value: "True"

      - key: EMAIL_USE_TLS
        value: "False"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "no-reply@artisanmarketplace.ng"

      - key: STORAGE_ENDPOINT_URL
        sync: false

      - key: STORAGE_BUCKET
        value: "artisan-verification-private"

      - key: STORAGE_ACCESS_KEY
        sync: false

      - key: STORAGE_SECRET_KEY
        sync: false

      - key: STORAGE_REGION
        value: "auto"

      - key: SENTRY_DSN
        sync: false

      - key: SENTRY_ENVIRONMENT
        value: "production"

  - type: worker
    name: artisan-marketplace-beat
    runtime: docker
    plan: <YOUR_BEAT_PLAN>
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A config beat -l info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: artisan-marketplace-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: artisan-marketplace-redis
          property: connectionString

      - key: SECRET_KEY
        fromService:
          name: artisan-marketplace-web
          type: web
          envVarKey: SECRET_KEY

      - key: DEBUG
        value: "False"

databases:
  - name: artisan-marketplace-db
    plan: <YOUR_DB_PLAN>
    region: frankfurt
    databaseName: artisan_marketplace
    user: artisan_marketplace
    postgresMajorVersion: "18"

  - name: artisan-marketplace-redis
