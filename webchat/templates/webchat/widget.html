{% load static %}
<div id="chat-widget" class="chat-widget" data-state="closed">
  <button type="button" class="chat-bubble" data-chat-toggle aria-label="Open chat" aria-expanded="false">
    <span class="chat-bubble-icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8c-1.1 0-2.1-.2-3-.6L4 21l1.6-4.8C4.6 15 4 13.6 4 12z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>

  <div class="chat-panel" data-chat-panel role="dialog" aria-label="Chat with {{ site_name|default:'us' }}" aria-hidden="true">
    <div class="chat-panel-header">
      <div>
        <p class="chat-panel-title">{{ site_name|default:"Nigeria Artisan Marketplace" }}</p>
        <p class="chat-panel-sub" data-chat-status>Tell us what you need</p>
      </div>
      <button type="button" class="chat-panel-close" data-chat-toggle aria-label="Close chat">&times;</button>
    </div>

    <div class="chat-messages" data-chat-messages aria-live="polite">
      <div class="chat-bubble-msg chat-bubble-out">
        <p>Hi 👋 Welcome to {{ site_name|default:"Nigeria Artisan Marketplace" }}. Verify your number below to get started — it only takes a moment.</p>
      </div>
    </div>

    <form class="chat-form" data-chat-verify-phone-form>
      <label for="chat-phone">Your phone number</label>
      <div class="chat-form-row">
        <input type="tel" id="chat-phone" name="phone" placeholder="+234 801 234 5678" autocomplete="tel" inputmode="tel" required>
        <button type="submit" class="btn btn-accent btn-small">Send code</button>
      </div>
      <p class="chat-form-error" data-chat-error="phone" role="alert"></p>
    </form>

    <form class="chat-form" data-chat-verify-code-form hidden>
      <label for="chat-code">6-digit code</label>
      <div class="chat-form-row">
        <input type="text" id="chat-code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
        <button type="submit" class="btn btn-accent btn-small">Verify</button>
      </div>
      <button type="button" class="btn-link" data-chat-resend>Didn't get it? Resend code</button>
      <p class="chat-form-error" data-chat-error="code" role="alert"></p>
    </form>

    <form class="chat-input-row" data-chat-message-form hidden>
      <button type="button" class="chat-tool-btn" data-chat-location title="Share my location" aria-label="Share my location">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21s7-6.1 7-11.5S16.4 3 12 3 5 5.6 5 9.5 12 21 12 21z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <label class="chat-tool-btn" title="Upload ID photo" aria-label="Upload ID photo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12v6a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16 3l5 5-9 9H8v-4l8-9z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <input type="file" accept="image/jpeg,image/png,image/webp" data-chat-upload hidden>
      </label>
      <input type="text" name="text" placeholder="Type a message…" autocomplete="off" data-chat-text-input maxlength="1000" aria-label="Message">
      <button type="submit" class="btn btn-accent btn-small">Send</button>
    </form>
  </div>
</div>
